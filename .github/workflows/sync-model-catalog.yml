name: Sync model catalog and publish npm package

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: sync-model-catalog-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Enable npm Trusted Publishing support
        run: npm install --global npm@^11.5.1

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install web dependencies
        run: npm ci --prefix src/web --ignore-scripts

      - name: Generate model catalog snapshot
        env:
          MODEL_CATALOG_REPORT_PATH: ${{ runner.temp }}/model-catalog-sync-report.md
        run: npm run sync:model-catalog

      - name: Check for model catalog changes
        id: catalog
        run: |
          if git diff --quiet -- src/config/model-metadata.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No model metadata changes; skipping npm publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose date-stamped package version
        id: version
        if: steps.catalog.outputs.changed == 'true'
        run: |
          next_version=$(node scripts/next-model-catalog-version.js)
          npm version "$next_version" --no-git-tag-version
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Check whether this date's package version already exists
        id: version-availability
        if: steps.catalog.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "coding-tool-x@$VERSION" version >/dev/null 2>&1; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION was already published today; leaving this catalog change for the next daily run."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm
        if: steps.catalog.outputs.changed == 'true' && steps.version-availability.outputs.available == 'true'
        run: npm publish --access public --tag latest

      - name: Commit and push catalog update
        if: steps.catalog.outputs.changed == 'true' && steps.version-availability.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/config/model-metadata.json package.json package-lock.json
          git commit -m "chore: sync model catalog and release ${{ steps.version.outputs.version }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
