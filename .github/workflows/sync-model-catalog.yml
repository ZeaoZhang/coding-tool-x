name: Sync model catalog

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate model catalog snapshot
        env:
          MODEL_CATALOG_REPORT_PATH: ${{ runner.temp }}/model-catalog-sync-report.md
        run: npm run sync:model-catalog

      - name: Open snapshot update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: src/config/model-metadata.json
          branch: automation/model-catalog-sync
          delete-branch: true
          commit-message: 'chore: sync model catalog snapshot'
          title: 'chore: sync model catalog snapshot'
          body-path: ${{ runner.temp }}/model-catalog-sync-report.md
